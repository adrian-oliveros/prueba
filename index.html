<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CV AR Portfolio</title>

    <!-- 1. A-Frame (Motor 3D simplificado de Mozilla) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- 2. MindAR para A-Frame (Manejo de Image Tracking sin fallos) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Indicador estético superior */
        #status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
</head>

<body>

<div id="status-bar">Apunta la cámara al QR de mi currículum...</div>

<!-- Escena AR de A-Frame conectada a tu archivo qr.mind -->
<a-scene 
    mindar-image="imageTargetSrc: ./qr.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" 
    color-space="sRGB" 
    embedded 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <!-- Carga del modelo GLB como asset pre-cargado -->
    <a-assets>
        <a-asset-item id="dogModel" src="./model.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Objeto anclado al QR (targetIndex: 0) -->
    <a-entity mindar-image-target="targetIndex: 0" id="qr-target">
        
        <!-- Modelo 3D del perro animado -->
        <a-gltf-model 
            src="#dogModel" 
            position="0 0 0" 
            rotation="90 0 0" 
            scale="0.3 0.3 0.3"
            animation-mixer>
        </a-gltf-model>

    </a-entity>
</a-scene>

<script>
    const statusBar = document.getElementById("status-bar");
    const qrTarget = document.getElementById("qr-target");

    // Eventos para detectar cuándo el QR entra y sale de vista
    qrTarget.addEventListener("targetFound", () => {
        statusBar.innerText = "¡QR Detectado!";
        setTimeout(() => {
            statusBar.style.display = "none";
        }, 2000);
    });

    qrTarget.addEventListener("targetLost", () => {
        statusBar.style.display = "block";
        statusBar.innerText = "Apunta la cámara al QR de mi currículum...";
    });
</script>

<!-- Componente para activar la reproducción automática de animaciones en A-Frame -->
<script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>

</body>
</html>
