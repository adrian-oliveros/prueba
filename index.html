<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CV AR Portfolio</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #ar-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Estilos obligatorios para evitar la pantalla negra de MindAR */
        #ar-container video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        #ar-container canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 2;
        }

        #status-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 85%;
        }

        #start-cam-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        #start-cam-btn:active {
            background: #1d4ed8;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>
</head>

<body>

<div id="status-bar">
    <span id="status-text">Toca el botón para permitir el uso de la cámara:</span>
    <button id="start-cam-btn">📷 Abrir Cámara</button>
</div>

<div id="ar-container"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MindARThree } from "mindar-image-three";

const statusText = document.getElementById("status-text");
const startBtn = document.getElementById("start-cam-btn");
const container = document.querySelector("#ar-container");

const mindarThree = new MindARThree({
    container: container,
    imageTargetSrc: "./qr.mind",
    uiLoading: "no",
    uiScanning: "no",
    uiError: "no"
});

const { renderer, scene, camera } = mindarThree;

// Asegurar fondo transparente en WebGL para que el vídeo de la cámara no quede tapado
renderer.setClearColor(0x000000, 0);

// Iluminación
const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0);
directionalLight.position.set(2, 5, 5);
scene.add(directionalLight);

const anchor = mindarThree.addAnchor(0);

let model = null;
let mixer = null;
const clock = new THREE.Clock();

// Carga del modelo GLTF
const loader = new GLTFLoader();
loader.load(
    "./model.glb",
    (gltf) => {
        model = gltf.scene;
        model.scale.set(0.3, 0.3, 0.3);
        model.rotation.x = Math.PI / 2; // Orientación sobre el papel

        if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(model);
            gltf.animations.forEach((clip) => {
                mixer.clipAction(clip).play();
            });
        }

        anchor.group.add(model);
    },
    undefined,
    (err) => {
        statusText.innerText = "Error cargando model.glb: " + err.message;
    }
);

anchor.onTargetFound = () => {
    statusText.innerText = "¡QR Detectado!";
    setTimeout(() => {
        document.getElementById("status-bar").style.display = "none";
    }, 2500);
};

renderer.setAnimationLoop(() => {
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);
    renderer.render(scene, camera);
});

// Inicialización de la cámara
startBtn.addEventListener("click", async () => {
    statusText.innerText = "Iniciando cámara...";
    startBtn.style.display = "none";

    try {
        await mindarThree.start();
        
        // Forzar ajuste del vídeo inyectado por MindAR
        const video = container.querySelector("video");
        if (video) {
            video.setAttribute("playsinline", "");
            video.setAttribute("muted", "");
            await video.play();
        }

        statusText.innerText = "Apunta la cámara al QR de mi currículum...";
    } catch (err) {
        statusText.innerText = "Error de cámara: " + err.message;
        console.error(err);
    }
});
</script>

</body>
</html>
