<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CV AR Portfolio - Google WebXR</title>

    <!-- Componente Oficial de Google <model-viewer> -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
        }

        /* Visor 3D y AR de Google ocupando el 100% de la pantalla */
        model-viewer {
            width: 100vw;
            height: 100vh;
            background-color: #0f172a;
            --poster-color: transparent;
        }

        /* Botón AR Oficial de Google (Personalizado) */
        #ar-button {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        #ar-button:active {
            transform: translateX(-50%) scale(0.96);
        }

        /* Mensaje informativo inicial */
        #hint-badge {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 998;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }

        /* Selector Flotante de Vídeos / Proyectos */
        #video-selector {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .video-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .video-btn:active {
            background: #2563eb;
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div id="hint-badge">Arrastra para rotar en 360°</div>

    <!-- Visor de Google WebXR -->
    <model-viewer 
        id="dog-viewer"
        src="./model.glb" 
        alt="Modelo 3D Interactivo de CV"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        shadow-intensity="1.5"
        shadow-softness="1"
        autoplay
        exposure="1">

        <!-- Botón AR personalizado que dispara la cámara nativa -->
        <button slot="ar-button" id="ar-button">
            <span>📱 Ver Perro en tu Espacio (AR)</span>
        </button>

    </model-viewer>

    <!-- Selector Flotante de Vídeos -->
    <div id="video-selector">
        <button class="video-btn" onclick="openLink('https://www.youtube.com')">
            🎬 Proyecto 1
        </button>
        <button class="video-btn" onclick="openVideo('https://www.youtube.com')">
            🚀 Showreel
        </button>
        <button class="video-btn" onclick="openVideo('https://www.linkedin.com')">
            💼 LinkedIn
        </button>
    </div>

    <script>
        function openVideo(url) {
            window.open(url, "_blank");
        }
    </script>

</body>
</html>
