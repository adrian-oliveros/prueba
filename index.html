<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Portfolio CV - AR Experience</title>

    <!-- Motor 3D A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- Motor AR.js para Tracking de Marcador/QR -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- Animaciones GLTF -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Status Bar Superior */
        #status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            pointer-events: none;
        }

        /* Selector de Vídeos / Proyectos (FASE 2) */
        #video-selector {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.3s ease;
        }

        #video-selector.active {
            opacity: 1;
            pointer-events: auto;
        }

        .video-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .video-btn:active {
            background: #2563eb;
            transform: scale(0.95);
        }
    </style>
</head>

<body>

<div id="status-bar">Apunta la cámara al QR de mi currículum...</div>

<!-- Selector Flotante de Vídeos / Portfolio -->
<div id="video-selector">
    <button class="video-btn" onclick="openVideo('https://www.youtube.com/watch?v=dQw4w9WgXcQ')">
        🎬 Proyecto 1
    </button>
    <button class="video-btn" onclick="openVideo('https://www.youtube.com/watch?v=dQw4w9WgXcQ')">
        🚀 Showreel
    </button>
    <button class="video-btn" onclick="openVideo('https://www.linkedin.com')">
        💼 LinkedIn
    </button>
</div>

<!-- Escena AR Estilo Business Card -->
<a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false">

    <a-assets>
        <a-asset-item id="dogModel" src="./model.glb"></a-asset-item>
    </a-assets>

    <!-- Marcador genérico o QR -->
    <a-marker preset="hire" id="qr-marker">
        
        <!-- Modelo 3D en el centro -->
        <a-gltf-model 
            src="#dogModel" 
            position="0 0 0" 
            rotation="-90 0 0" 
            scale="0.4 0.4 0.4"
            animation-mixer>
        </a-gltf-model>

    </a-marker>

    <a-entity camera></a-entity>
</a-scene>

<script>
    const statusBar = document.getElementById("status-bar");
    const videoSelector = document.getElementById("video-selector");
    const marker = document.getElementById("qr-marker");

    let detectedOnce = false;

    // Cuando detecta el QR impreso
    marker.addEventListener("markerFound", () => {
        statusBar.innerText = "¡Portfolio Activado!";
        videoSelector.classList.add("active");

        if (!detectedOnce) {
            detectedOnce = true;
            setTimeout(() => {
                statusBar.style.opacity = "0";
            }, 2000);
        }
    });

    // Función para abrir los vídeos de YouTube al pulsar los botones
    function openVideo(url) {
        window.open(url, "_blank");
    }
</script>

</body>
</html>
