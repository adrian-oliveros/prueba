<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CV AR Portfolio</title>

    <!-- 1. A-Frame (Motor 3D de Mozilla) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- 2. MindAR para A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- 3. Librería para animación automática en A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
</head>

<body>

<div id="status-bar">Apunta la cámara al QR de mi currículum...</div>

<a-scene 
    mindar-image="imageTargetSrc: ./qr.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" 
    color-space="sRGB" 
    embedded 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
        <a-asset-item id="dogModel" src="./model.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Objeto anclado al QR -->
    <a-entity mindar-image-target="targetIndex: 0" id="qr-target">
        
        <!-- 
          Ajustes clave:
          - position="0 0 0": Si flota o se entierra, cambia el segundo número (ej: "0 -0.2 0" o "0 0.1 0")
          - rotation="90 0 0": Pone al perro de pie sobre el papel horizontal
        -->
        <a-gltf-model 
            id="dog-entity"
            src="#dogModel" 
            position="0 0 0" 
            rotation="90 0 0" 
            scale="0.3 0.3 0.3"
            animation-mixer>
        </a-gltf-model>

    </a-entity>
</a-scene>

<script>
    const statusBar = document.getElementById("status-bar");
    const qrTarget = document.getElementById("qr-target");
    const dogEntity = document.getElementById("dog-entity");

    let isDogVisible = false;

    qrTarget.addEventListener("targetFound", () => {
        isDogVisible = true;
        statusBar.innerText = "¡QR Detectado!";
        setTimeout(() => {
            statusBar.style.display = "none";
        }, 2000);
    });

    // Anulamos la ocultación cuando se pierde el encuadre
    qrTarget.addEventListener("targetLost", () => {
        if (isDogVisible) {
            // Forzamos a que el modelo siga siendo visible en pantalla
            dogEntity.setAttribute("visible", "true");
        }
    });
</script>

</body>
</html>
