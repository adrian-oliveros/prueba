<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio AR - Curriculum</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0f12;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #status-bar {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 23, 42, 0.9);
            color: #f8fafc;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            backdrop-filter: blur(8px);
        }

        model-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: none;
            --poster-color: transparent;
        }

        /* Botón de bienvenida profesional para lanzar la AR */
        #ar-button {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4);
            z-index: 20;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #ar-button:active {
            transform: translateX(-50%) scale(0.96);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
        }
    </style>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>

<body>

<div id="status-bar">Apunta la cámara al QR de mi currículum...</div>

<video id="webcam" autoplay playsinline muted></video>

<!-- 
  Ajustes clave añadidos:
  - scale="0.2 0.2 0.2": Ajusta el tamaño para que sea un perro a escala real.
  - ar-placement="floor": Le dice al móvil que busque el suelo/mesa para permitirte acercarte.
  - ar-scale="fixed": Evita que el perro cambie de tamaño al alejarte/acercarte.
-->
<model-viewer 
    id="dog-viewer"
    src="./model.glb"
    alt="Animación 3D Portfolio"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed"
    scale="0.2 0.2 0.2"
    camera-controls
    autoplay
    shadow-intensity="1">
    
    <button slot="ar-button" id="ar-button">
        ✨ Toca aquí para ver la animación en tu suelo/mesa
    </button>
</model-viewer>

<script>
    const video = document.getElementById("webcam");
    const statusBar = document.getElementById("status-bar");
    const dogViewer = document.getElementById("dog-viewer");

    const scanCanvas = document.createElement("canvas");
    const scanCtx = scanCanvas.getContext("2d");
    let hasSpawned = false;

    // Reproducir la animación inmediatamente al cargar el archivo 3D
    dogViewer.addEventListener("load", () => {
        const availableAnimations = dogViewer.availableAnimations;
        if (availableAnimations && availableAnimations.length > 0) {
            dogViewer.animationName = availableAnimations[0];
            dogViewer.play();
        }
    });

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }
            });
            video.srcObject = stream;
            await video.play();
            requestAnimationFrame(scanQR);
        } catch (err) {
            statusBar.innerText = "Error accediendo a la cámara: " + err.message;
        }
    }

    function scanQR() {
        if (hasSpawned) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            scanCanvas.width = video.videoWidth;
            scanCanvas.height = video.videoHeight;
            scanCtx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);

            const imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);

            if (code) {
                hasSpawned = true;
                statusBar.innerText = "¡QR Detectado! Revisa la animación en 3D:";

                const stream = video.srcObject;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                video.style.display = "none";

                dogViewer.style.display = "block";
                
                if (dogViewer.availableAnimations.length > 0) {
                    dogViewer.animationName = dogViewer.availableAnimations[0];
                    dogViewer.play();
                }

                return;
            }
        }

        requestAnimationFrame(scanQR);
    }

    startCamera();
</script>

</body>
</html>
