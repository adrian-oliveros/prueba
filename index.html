<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CV AR Portfolio</title>

    <!-- Motor A-Frame + AR.js Nativo Móvil -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            width: 85%;
            max-width: 400px;
            pointer-events: none;
        }

        #video-selector {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .video-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .video-btn:active {
            background: #2563eb;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">

    <div id="status-bar">Apunta la cámara al marcador Hiro...</div>

    <div id="video-selector">
        <button class="video-btn" onclick="openLink('https://www.youtube.com')">🎬 Proyecto 1</button>
        <button class="video-btn" onclick="openLink('https://www.youtube.com')">🚀 Showreel</button>
        <button class="video-btn" onclick="openLink('https://www.linkedin.com')">💼 LinkedIn</button>
    </div>

    <!-- Escena AR.js con inicialización directa de la cámara móvil -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="dogModel" src="./model.glb"></a-asset-item>
        </a-assets>

        <!-- Marcador estándar Hiro -->
        <a-marker preset="hiro" id="marker">
            <a-entity 
                gltf-model="#dogModel"
                position="0 0 0" 
                scale="0.3 0.3 0.3" 
                rotation="0 0 0">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const statusBar = document.getElementById("status-bar");
        const videoSelector = document.getElementById("video-selector");

        document.addEventListener("DOMContentLoaded", () => {
            const marker = document.querySelector("#marker");

            marker.addEventListener("markerFound", () => {
                statusBar.innerText = "¡Marcador detectado!";
                videoSelector.style.display = "flex";
            });

            marker.addEventListener("markerLost", () => {
                statusBar.innerText = "Apunta la cámara al marcador...";
                videoSelector.style.display = "none";
            });
        });

        function openLink(url) {
            window.open(url, "_blank");
        }
    </script>

</body>
</html>
