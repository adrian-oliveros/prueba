<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CV AR Portfolio</title>

    <!-- A-Frame v1.4.2 (Versión Oficial Recomendada por MindAR) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- MindAR v1.2.2 (Build Estable de GitHub) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <!-- Plugin Oficial de Animaciones GLTF para A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Ocultar interfaz por defecto de A-Frame/VR */
        .a-enter-vr-button {
            display: none !important;
        }

        /* Banner indicador en la parte superior */
        #status-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
</head>

<body>

<div id="status-info">Apunta la cámara al QR de mi currículum...</div>

<!-- Escena Oficial MindAR -->
<a-scene 
    mindar-image="imageTargetSrc: ./qr.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" 
    color-space="sRGB" 
    embedded 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
        <!-- Carga de tu archivo 3D -->
        <a-asset-item id="dogModel" src="./model.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Objetivo del rastreador vinculado a tu qr.mind (Índice 0) -->
    <a-entity mindar-image-target="targetIndex: 0" id="qr-target">
        
        <!-- 
          Configuración del modelo 3D:
          - rotation="0 0 0": Coloca al perro mirando de frente al papel.
          - position="0 0 0": Centrado sobre el QR.
          - scale="0.3 0.3 0.3": Ajuste proporcional.
        -->
        <a-gltf-model 
            id="dog-model"
            src="#dogModel" 
            position="0 0 0" 
            rotation="0 0 0" 
            scale="0.3 0.3 0.3"
            animation-mixer="clip: *; loop: repeat;">
        </a-gltf-model>

    </a-entity>
</a-scene>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const statusInfo = document.getElementById("status-info");
        const qrTarget = document.getElementById("qr-target");

        // Evento: Cuando la cámara detecta el QR impreso/en pantalla
        qrTarget.addEventListener("targetFound", () => {
            statusInfo.innerText = "¡QR Detectado!";
            setTimeout(() => {
                statusInfo.style.opacity = "0";
                statusInfo.style.transition = "opacity 0.5s ease";
            }, 1500);
        });

        // Evento: Si la cámara pierde el QR
        qrTarget.addEventListener("targetLost", () => {
            statusInfo.style.opacity = "1";
            statusInfo.innerText = "Apunta la cámara al QR de mi currículum...";
        });
    });
</script>

</body>
</html>
