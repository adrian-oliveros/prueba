<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio CV - AR Experience</title>

    <!-- Motor A-Frame v1.4.2 -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- AR.js para A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- Animaciones GLTF -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* FIX CRÍTICO: Forzar a que el vídeo de la cámara ocupe TODA la pantalla */
        video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            margin: 0 !important;
            z-index: 1 !important;
        }

        /* FIX CRÍTICO: Forzar el Canvas 3D por encima del vídeo sin bloquearlo */
        .a-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 2 !important;
        }

        /* Indicador Superior */
        #status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Selector Flotante de Vídeos / Portfolio */
        #video-selector {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.3s ease;
        }

        #video-selector.active {
            opacity: 1;
            pointer-events: auto;
        }

        .video-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .video-btn:active {
            background: #2563eb;
            transform: scale(0.95);
        }
    </style>
</head>

<body>

<div id="status-bar">Apunta la cámara al marcador de mi currículum...</div>

<div id="video-selector">
    <button class="video-btn" onclick="openVideo('https://www.youtube.com')">
        🎬 Proyecto 1
    </button>
    <button class="video-btn" onclick="openVideo('https://www.youtube.com')">
        🚀 Showreel
    </button>
    <button class="video-btn" onclick="openVideo('https://www.linkedin.com')">
        💼 LinkedIn
    </button>
</div>

<!-- Escena AR con ajuste de resolución forzado -->
<a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
    vr-mode-ui="enabled: false">

    <a-assets>
        <a-asset-item id="dogModel" src="./model.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="./marker.patt" id="patt-marker">
        <a-gltf-model 
            src="#dogModel" 
            position="0 0 0" 
            rotation="-90 0 0" 
            scale="0.4 0.4 0.4"
            animation-mixer>
        </a-gltf-model>
    </a-marker>

    <a-entity camera></a-entity>
</a-scene>

<script>
    const statusBar = document.getElementById("status-bar");
    const videoSelector = document.getElementById("video-selector");
    const marker = document.getElementById("patt-marker");

    marker.addEventListener("markerFound", () => {
        statusBar.innerText = "¡Marcador Detectado!";
        videoSelector.classList.add("active");

        setTimeout(() => {
            statusBar.style.opacity = "0";
        }, 1500);
    });

    marker.addEventListener("markerLost", () => {
        statusBar.style.opacity = "1";
        statusBar.innerText = "Apunta la cámara al marcador de mi currículum...";
    });

    function openVideo(url) {
        window.open(url, "_blank");
    }

    // Corregir tamaño del vídeo al cambiar orientación o redimensionar
    window.addEventListener("resize", () => {
        const video = document.querySelector("video");
        if (video) {
            video.style.width = "100vw";
            video.style.height = "100vh";
        }
    });
</script>

</body>
</html>
