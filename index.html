<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CV AR Portfolio</title>

    <!-- Motor A-Frame y MindAR unificados -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Fuerza al canvas de la cámara a mostrarse siempre visible */
        canvas, video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
        }

        /* Banner informativo flotante */
        #status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            width: 85%;
            max-width: 400px;
            pointer-events: none;
        }

        /* Botones flotantes inferiores */
        #video-selector {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .video-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .video-btn:active {
            background: #2563eb;
        }
    </style>
</head>

<body>

    <div id="status-bar">Apunta la cámara al marcador de tu CV...</div>

    <div id="video-selector">
        <button class="video-btn" onclick="openLink('https://www.youtube.com')">🎬 Proyecto 1</button>
        <button class="video-btn" onclick="openLink('https://www.youtube.com')">🚀 Showreel</button>
        <button class="video-btn" onclick="openLink('https://www.linkedin.com')">💼 LinkedIn</button>
    </div>

    <!-- Escena AR -->
    <a-scene 
        mindar-image="imageTargetSrc: ./qr.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="dogModel" src="./model.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                src="#dogModel" 
                position="0 0 0" 
                scale="0.3 0.3 0.3" 
                rotation="90 0 0">
            </a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        const statusBar = document.getElementById("status-bar");
        const videoSelector = document.getElementById("video-selector");

        // Script para desbloquear la reproducción de vídeo de la cámara en Safari/Chrome móvil
        function forzarVideoCamara() {
            const video = document.querySelector('video');
            if (video) {
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.muted = true;
                video.play().catch(() => {});
            } else {
                setTimeout(forzarVideoCamara, 200);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            forzarVideoCamara();

            const sceneEl = document.querySelector('a-scene');

            sceneEl.addEventListener("arReady", () => {
                statusBar.innerText = "Cámara lista. Apunta al marcador...";
            });

            sceneEl.addEventListener("targetFound", () => {
                statusBar.innerText = "¡Marcador detectado!";
                videoSelector.style.display = "flex";
            });

            sceneEl.addEventListener("targetLost", () => {
                statusBar.innerText = "Apunta la cámara al marcador de tu CV...";
                videoSelector.style.display = "none";
            });
        });

        function openLink(url) {
            window.open(url, "_blank");
        }
    </script>

</body>
</html>
